services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skinfox
      POSTGRES_USER: skinfox
      POSTGRES_PASSWORD: skinfox
    ports: ["5432:5432"]
    volumes: [skinfox-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skinfox -d skinfox"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [skinfox-redis:/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: [skinfox-minio:/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
volumes:
  skinfox-postgres:
  skinfox-redis:
  skinfox-minio:
