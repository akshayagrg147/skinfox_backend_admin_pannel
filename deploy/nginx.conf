upstream skinfox_api {
  server api:4000;
}

# The default keeps the existing Elastic-IP URLs working until external DNS is
# changed. Named host blocks below take over automatically once A records point
# skinfox.in and its subdomains at this same server.
server {
  listen 80 default_server;
  server_name _;
  index index.html;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/ {
    proxy_pass http://skinfox_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /affiliate {
    return 301 /affiliate/;
  }

  location /affiliate/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /affiliate/index.html;
  }

  location / {
    root /usr/share/nginx/html/storefront;
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name skinfox.in www.skinfox.in;
  root /usr/share/nginx/html/storefront;
  index index.html;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/ {
    proxy_pass http://skinfox_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /affiliate {
    return 301 /affiliate/;
  }

  location /affiliate/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /affiliate/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name affiliate.skinfox.in;
  index index.html;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/ {
    proxy_pass http://skinfox_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The current affiliate bundle is also retained at /affiliate/ on the
  # storefront, so its base assets are served from this explicit location.
  location /affiliate/assets/ {
    alias /usr/share/nginx/html/affiliate/assets/;
  }

  location /brand/ {
    alias /usr/share/nginx/html/storefront/brand/;
  }

  location / {
    root /usr/share/nginx/html/affiliate;
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name admin.skinfox.in;
  root /usr/share/nginx/html/admin;
  index index.html;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/ {
    proxy_pass http://skinfox_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Legacy IP-based Admin address. It will be removed from the public security
# group after HTTPS is active on admin.skinfox.in.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html/admin;
  index index.html;

  location /api/ {
    proxy_pass http://skinfox_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
