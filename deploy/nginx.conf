upstream skinfox_api {
  server api:4000;
}

# The Elastic-IP URL remains available over HTTP for transition purposes. The
# named hosts below redirect to HTTPS, apart from Let’s Encrypt challenges.
server {
  listen 80 default_server;
  server_name _;
  index index.html;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/ {
    proxy_pass http://skinfox_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /affiliate {
    return 301 /affiliate/;
  }

  location /affiliate/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /affiliate/index.html;
  }

  location / {
    root /usr/share/nginx/html/storefront;
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name skinfox.in www.skinfox.in;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 80;
  server_name affiliate.skinfox.in;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 80;
  server_name admin.skinfox.in;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name skinfox.in www.skinfox.in;
  root /usr/share/nginx/html/storefront;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/skinfox.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/skinfox.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  location /api/ {
    proxy_pass http://skinfox_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /affiliate {
    return 301 /affiliate/;
  }

  location /affiliate/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /affiliate/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 443 ssl;
  server_name affiliate.skinfox.in;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/skinfox.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/skinfox.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  location /api/ {
    proxy_pass http://skinfox_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The affiliate bundle is also retained at /affiliate/ on the storefront,
  # so assets are available at this explicit base path on the subdomain.
  location /affiliate/assets/ {
    alias /usr/share/nginx/html/affiliate/assets/;
  }

  location /brand/ {
    alias /usr/share/nginx/html/storefront/brand/;
  }

  location / {
    root /usr/share/nginx/html/affiliate;
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 443 ssl;
  server_name admin.skinfox.in;
  root /usr/share/nginx/html/admin;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/skinfox.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/skinfox.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  location /api/ {
    proxy_pass http://skinfox_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Legacy IP-based Admin address. It remains temporarily for migration, but is
# not appropriate for secure production logins once COOKIE_SECURE is enabled.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html/admin;
  index index.html;

  location /api/ {
    proxy_pass http://skinfox_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
