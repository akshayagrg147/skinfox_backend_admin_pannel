services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skinfox
      POSTGRES_USER: skinfox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - skinfox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skinfox -d skinfox"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - skinfox-redis:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    env_file:
      - deploy/server.env
    environment:
      DATABASE_URL: postgresql://skinfox:${POSTGRES_PASSWORD}@db:5432/skinfox?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
      NODE_ENV: production
      SEED_DATABASE: ${SEED_DATABASE:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-skinfox}
      GOOGLE_APPLICATION_CREDENTIALS: /app/deploy/firebase-service-account.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - skinfox-uploads:/app/server/uploads
      # Firebase Admin key is provisioned on the host and never committed.
      - ./deploy/firebase-service-account.json:/app/deploy/firebase-service-account.json:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_AFFILIATE_BASE: /affiliate/
        VITE_STOREFRONT_URL: ${STOREFRONT_ORIGIN:?STOREFRONT_ORIGIN is required}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-AIzaSyAFf3WX_NQ4aSYIydprdSBZMU4TF6COIyg}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-skinfox.firebaseapp.com}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-skinfox}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-skinfox.firebasestorage.app}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-639101212327}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-1:639101212327:web:1339fc21b9eb2c15c02d82}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      # Kept outside Git: Certbot stores account material and issued certificates here.
      - ./deploy/certbot-webroot:/var/www/certbot:ro
      - ./deploy/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api

volumes:
  skinfox-postgres:
  skinfox-redis:
  skinfox-uploads:
